name: Bug
description: Something does not work as it should
labels: ["type: bug"]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. 
        2. 
        3. 
  - type: input
    id: error_code
    attributes:
      label: Error code shown
      description: The module error code from the screen or the API response, for example AUTH_PIN_LOCKED.
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or log
      description: Drag an image in here. Never paste handbook text, keys or personal data.
