# The real setup, as it runs on Supercube's server:  docker compose up -d
# On your laptop, add the dev file:  docker compose -f compose.yaml -f compose.dev.yaml up
# All settings come from .env (copy .env.example to .env).

x-backend: &backend
  image: mechai-backend:${VERSION:-latest}
  build:
    context: ./backend
    target: prod
  env_file: .env
  environment:
    POSTGRES_HOST: db
  volumes:
    - files:/data/files
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    <<: *backend
    # Runs the database migrations, then starts the API (see backend/Dockerfile).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy  # wait until the migrations ran

  web:
    image: mechai-web:${VERSION:-latest}
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  files:
