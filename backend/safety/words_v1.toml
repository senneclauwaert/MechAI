# Word lists for the code-side safety gate (ADR-30). Read once by assistant/checks.py.
#
# Matching rules (see checks.py): case, accents, hyphens and extra spaces are ignored.
# An entry with "+" needs all its parts in the text. A part of 6 or more characters matches
# anywhere (so "batterij" also finds "batterijkabel"); a shorter part only as a whole word.
# A part ending in "*" matches the start of a word ("accu*" finds "accukabel"), a part starting
# with "*" matches the end of a word ("*lader" finds "acculader"). The [ignore] list holds whole
# words that are blanked out before matching, so "accurate" does not match "accu*".
#
# Never remove an entry without a test that shows why. A new list is a new file (words_v2.toml).

[emergency]
nl = [
  "rook", "rookt", "brandgeur", "brandlucht", "in brand", "opgezwollen", "gezwollen",
  "warm+batterij", "heet+batterij", "hete+batterij", "hete+accu", "gewond",
  "geelektrocuteerd", "explosie", "ontplof", "vlammen", "brandt", "vuur",
  "ruikt+verbrand",
  "heet+accu", "hete+accu", "warm+accu", "warme+accu", "warme+batterij", "elektrische schok",
  "schok gekregen", "gekwetst", "verwond", "er is brand", "rookontwikkeling",
  "rookwolk",
  # "verbrand" alone also means burnt brake pads: only with a battery, motor, smoke or a person
  "verbrand+batterij", "verbrand+accu*", "verbrand+motor", "verbrand+rook", "verbrand+hand",
  "verbrand+handen", "verbrand+arm", "verbrand+vinger", "verbrand+vingers", "verbrand+gezicht",
  "verbrand+been", "ik ben verbrand", "me verbrand", "mij verbrand",
  "zich verbrand", "brandwond",
]
fr = [
  "fumee", "en feu", "odeur de brule", "chaude+batterie", "blesse",
  "explosion", "flammes", "fume", "fument", "il y a le feu", "prend feu", "pris feu",
  "sent le brule", "choc electrique", "brulant+batterie",
  # "gonfle" also covers gonflee and gonfler; alone it means inflating a tyre
