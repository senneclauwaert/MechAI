# Word lists for the code-side safety gate (ADR-30). Read once by assistant/checks.py.
#
# Matching rules (see checks.py): case, accents, hyphens and extra spaces are ignored.
# An entry with "+" needs all its parts in the text. A part of 6 or more characters matches
# anywhere (so "batterij" also finds "batterijkabel"); a shorter part only as a whole word.
#
# Never remove an entry without a test that shows why. A new list is a new file (words_v2.toml).

