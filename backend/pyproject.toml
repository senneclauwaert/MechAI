[project]
name = "mechai-backend"
version = "0.1.0"
description = "MechAi backend: FastAPI API and background worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "pgvector>=0.3,<1",
    "mistralai>=1.0,<4",
    "docling>=2,<3",
    "pypdfium2>=4",
    # direct so that [tool.uv.sources] below applies to them (docling pulls them in)
    "torch",
    "torchvision",
]

# Tools for development only (installed by `uv sync`, not in the server image)
[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
package = false  # this is an app, not a library: uv only installs the dependencies

# CPU-only torch: the default build pulls gigabytes of CUDA libraries we cannot use.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
